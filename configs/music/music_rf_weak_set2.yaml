task: weak
data:
  train: linkage_problems/Music/music_train_pairs_fv.csv
  test:  linkage_problems/Music/music_test_pairs_fv.csv
model:
  name: rf
  params:
    n_estimators: 100
    random_state: 42
label_model:
  n_epochs: 200
  lr: 0.01
lfs:
  - {type: average, high: 0.8,  low: 0.2}
  - {type: variance, high: 0.8, low: 0.2}
  - {type: weighted, high: 0.75, low: 0.25}
  - {type: graph,   threshold: 0.8, min_component_size: 3}
per_lf: true
combine: true
output:
  md: results/music/1ab_evaluation_RF_2.md
