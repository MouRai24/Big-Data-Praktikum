task: weak
data:
  train: linkage_problems/Music/music_train_pairs_fv.csv
  test:  linkage_problems/Music/music_test_pairs_fv.csv
model:
  name: lr
  params:
    max_iter: 1000
    class_weight: balanced
label_model:
  n_epochs: 200
  lr: 0.01
lfs:
  - {type: average, high: 0.9,  low: 0.1}
  - {type: variance, high: 0.9, low: 0.1}
  - {type: weighted, high: 0.8, low: 0.2}
  - {type: graph,   threshold: 0.5, min_component_size: 3}
per_lf: true
combine: true
output:
  md: results/music/1ba_evaluation_LR_1.md
