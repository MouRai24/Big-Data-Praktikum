task: weak
data:
  train: linkage_problems/wdc_almser/wdc_almser_train_pairs_fv.csv
  test:  linkage_problems/wdc_almser/wdc_almser_test_pairs_fv.csv
  exclude: ["exclude"]
model:
  name: lr
  params:
    max_iter: 1000
    class_weight: balanced
lfs:
  - {type: average, high: 0.80, low: 0.20}
  - {type: median,  high: 0.75, low: 0.25}
  - {type: graph,   threshold: 0.75, min_component_size: 3}
per_lf: true
combine: true
label_model:
  n_epochs: 200
  lr: 0.01
output:
  md: results/wdc/4_evaluation_LR_best_found_randomly_wdc_almser.md
